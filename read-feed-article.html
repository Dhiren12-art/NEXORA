
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXORA | Cricket Article</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .feed-article {
      max-width: 850px;
      margin: 55px auto;
      padding: 25px;
      color: #f7eeee;
    }
    .feed-category {
      color: #d6a0a5;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .feed-article h1 {
      font-size: clamp(32px, 7vw, 54px);
      line-height: 1.15;
      margin: 22px 0;
    }
    .feed-meta {
      color: #c5a9b3;
      margin-bottom: 28px;
    }
    .feed-image {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      background: #10090e;
      border-radius: 18px;
      margin-bottom: 28px;
    }
    .feed-summary {
      font-size: 19px;
      line-height: 1.8;
      color: #eadde2;
    }
    .feed-source {
      display: inline-block;
      margin-top: 25px;
      color: #d6a0a5;
    }
    
/* NEXORA PREMIUM ARTICLE DESIGN */

.feed-article {
    max-width: 900px;
    margin: 45px auto;
    padding: 35px;
    background: linear-gradient(145deg, #1b1018, #10090e);
    border: 1px solid rgba(214, 160, 165, 0.18);
    border-radius: 22px;
    box-shadow: 0 18px 55px rgba(0, 0, 0, 0.35);
}

.feed-category {
    display: inline-block;
    padding: 7px 14px;
    background: rgba(214, 160, 165, 0.12);
    border: 1px solid rgba(214, 160, 165, 0.3);
    border-radius: 30px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #e3aeb5;
}

.feed-article h1 {
    font-family: Georgia, serif;
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.2;
    letter-spacing: -0.7px;
    color: #fff1e8;
    margin: 24px 0;
}

.feed-meta {
    font-size: 13px;
    letter-spacing: 0.5px;
    color: #c5a9b3;
}

.feed-image {
    display: block;
    width: 100%;
    max-height: 500px;
    object-fit: cover;
    border-radius: 16px;
    margin: 30px 0;
    border: 1px solid rgba(214, 160, 165, 0.2);
}

.feed-summary {
    font-size: 19px;
    line-height: 1.9;
    color: #f1e4df;
}

.feed-source a {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;
    border: 1px solid #d6a0a5;
    border-radius: 30px;
    color: #f0c2c5;
    text-decoration: none;
    transition: 0.3s;
}

.feed-source a:hover {
    background: #d6a0a5;
    color: #160d12;
}

@media (max-width: 600px) {
    .feed-article {
        margin: 20px 12px;
        padding: 22px 18px;
        border-radius: 17px;
    }

    .feed-article h1 {
        font-size: 30px;
    }

    .feed-summary {
        font-size: 17px;
    }

    .feed-image {
        max-height: 280px;
    }
}
    
.article-divider {
    border: 0;
    height: 1px;
    background: rgba(214, 160, 165, 0.25);
    margin: 30px 0 22px;
}

.article-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
}

.share-button,
.back-button {
    display: inline-block;
    padding: 12px 20px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
}

.share-button {
    background: #d6a0a5;
    color: #160d12;
    border: 1px solid #d6a0a5;
}

.back-button {
    color: #e3b5bb;
    border: 1px solid rgba(214, 160, 165, 0.4);
}

.share-button:hover,
.back-button:hover {
    opacity: 0.85;
}

    
.whatsapp-button {
    background: #1f8f55;
    color: #ffffff;
    border: 1px solid #1f8f55;
}

.telegram-button {
    background: #238acb;
    color: #ffffff;
    border: 1px solid #238acb;
}

.whatsapp-button:hover,
.telegram-button:hover {
    opacity: 0.85;
}
    
    
  </style>
</head>
<body>
  <header>
    <div class="logo">NEXORA<span>.</span></div>
  </header>

  <main class="feed-article" id="article">
    <p>Loading article...</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://brqsolcojfxldrxfdnax.supabase.co";
    const SUPABASE_KEY = "sb_publishable_Se2OBOPmRlGVSIvMY-1W-w_tdJq3chD";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    async function loadArticle() {
      const articleBox = document.getElementById("article");
      const id = new URLSearchParams(window.location.search).get("id");

      if (!id) {
        articleBox.innerHTML = "<p>No article selected.</p>";
        return;
      }

      const { data, error } = await db
        .from("cricket_feed")
        .select("id, title, summary, source_name, source_url, image_url, published_at, created_at")
        .eq("id", id)
        .single();

      if (error || !data) {
        articleBox.innerHTML = "<p>Unable to load this article. Please try again.</p>";
        console.error(error);
        return;
      }

      const date = data.published_at || data.created_at;

      articleBox.innerHTML = `
        <p class="feed-category">${data.source_name || "Cricket News"}</p>
        <h1></h1>
        <p class="feed-meta">${date ? new Date(date).toLocaleString() : ""}</p>
        ${data.image_url ? `<img class="feed-image" src="${data.image_url}" alt="">` : ""}
        <div class="feed-summary"></div>
        
${data.source_url ? `<div class="feed-source"><a href="${data.source_url}" target="_blank" rel="noopener noreferrer">Read the original report ↗</a></div>` : ""}
<hr class="article-divider">

<div class="article-actions">
    <button class="share-button" onclick="shareArticle()">↗ Share Article</button>
    <a class="whatsapp-button" href="https://wa.me/?text=${encodeURIComponent(data.title + ' ' + window.location.href)}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
    <a class="telegram-button" href="https://t.me/share/url?url=${encodeURIComponent(window.location.href)}&text=${encodeURIComponent(data.title)}" target="_blank" rel="noopener noreferrer">Telegram</a>
    <a class="back-button" href="index.html">← Back to NEXORA</a>
</div>


      `;

      articleBox.querySelector("h1").textContent = data.title || "";
      articleBox.querySelector(".feed-summary").textContent = data.summary || "";
    }

 
async function shareArticle() {
    const title = document.querySelector("h1").textContent;
    const url = window.location.href;

    if (navigator.share) {
        try {
            await navigator.share({
                title: title,
                text: "Read this article on NEXORA",
                url: url
            });
        } catch (error) {
            console.log("Sharing cancelled");
        }
    } else {
        try {
            await navigator.clipboard.writeText(url);
            alert("Article link copied!");
        } catch (error) {
            prompt("Copy this article link:", url);
        }
    }
}
    
    loadArticle();
  </script>
</body>
</html>
