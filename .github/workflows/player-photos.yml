
name: NEXORA Player Photo Updater

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  update-player-photos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update missing player photos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python player_photo_updater.py
        
